[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwfont"
version = "0.0.1"
description = "Turn a page of handwriting into an installable font"
requires-python = ">=3.11"
dependencies = [
    "fonttools",
    "freetype-py",  # draws glyphs for the preview
    "numpy",
    "opencv-python>=4.7",  # 4.7 moved the ArUco marker code into the main package
    "pillow",
    "potracer",
    "pypdfium2",  # reads filled-in pages saved as PDF (scanner apps, tablets)
    "reportlab",
    "uharfbuzz",  # applies the font's OpenType rules (rotating variants) for the preview
]

[project.scripts]
hwfont = "hwfont.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
